name: Deploy production database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY to apply pending migrations from main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply native migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    env:
      SUPABASE_PRODUCTION_DB_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
    steps:
      - name: Require an explicit main-branch deployment
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Production database deployments must run from main."
            exit 1
          fi
          if [ "$CONFIRMATION" != "DEPLOY" ]; then
            echo "Confirmation must be exactly DEPLOY."
            exit 1
          fi
          if [ -z "$SUPABASE_PRODUCTION_DB_URL" ]; then
            echo "The Production environment secret SUPABASE_PRODUCTION_DB_URL is required."
            exit 1
          fi

      - name: Checkout reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install pinned project dependencies
        env:
          SUPABASE_PRODUCTION_DB_URL: ""
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Verify Deck List release contract
        run: npm run verify:deck-list-release

      - name: Preview pending migrations
        run: supabase db push --db-url "$SUPABASE_PRODUCTION_DB_URL" --dry-run

      - name: Apply pending migrations
        run: supabase db push --db-url "$SUPABASE_PRODUCTION_DB_URL"

      - name: Provision Limitless Cron credential in Vault
        env:
          LIMITLESS_SYNC_SECRET: ${{ secrets.LIMITLESS_SYNC_SECRET }}
        run: |
          if [ -z "$LIMITLESS_SYNC_SECRET" ]; then
            echo "The Production environment secret LIMITLESS_SYNC_SECRET is required."
            exit 1
          fi
          if ! command -v psql >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
          psql "$SUPABASE_PRODUCTION_DB_URL" -X -q -v ON_ERROR_STOP=1 -o /dev/null <<'SQL'
          \getenv sync_secret LIMITLESS_SYNC_SECRET
          select vault.create_secret(:'sync_secret', 'limitless_sync_secret')
          where not exists (
            select 1 from vault.secrets where name = 'limitless_sync_secret'
          );
          select vault.update_secret(id, :'sync_secret')
          from vault.secrets where name = 'limitless_sync_secret';
          SQL

      - name: Verify migration history
        run: supabase migration list --db-url "$SUPABASE_PRODUCTION_DB_URL"

      - name: Verify schema contracts
        run: npm run schema:health -- --db-url-env SUPABASE_PRODUCTION_DB_URL

      - name: Run security advisors
        run: supabase db advisors --db-url "$SUPABASE_PRODUCTION_DB_URL" --type security --fail-on error
