project_id = "pokenotes-e2e"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3010"
additional_redirect_urls = ["http://localhost:3010/**", "http://127.0.0.1:3010/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Required for the email/password provider; the application exposes no public
# local signup flow and the guarded seed creates the sole fixture account.
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# GoTrue uses this switch for the email/password provider itself. The app has no
# public signup flow; the only local account is created by the guarded seed.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

[edge_runtime]
enabled = false

[analytics]
enabled = false
